# Alembic config for the CMS metadata DB (one SQLite file in v1, Postgres-ready).
#
# The database URL is NOT set here — env.py resolves it from the DATABASE_URL
# env var (CLI) or from the app settings (programmatic, via init_db). To target
# a specific DB from the CLI:
#
#     DATABASE_URL=sqlite+aiosqlite:///./data/harnext.sqlite uv run alembic upgrade head
#     DATABASE_URL=sqlite:///./data/harnext.sqlite uv run alembic revision --autogenerate -m "..."

[alembic]
script_location = packages/shared/src/harnext_shared/migrations
prepend_sys_path = .
path_separator = os

# ---- logging ----
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
