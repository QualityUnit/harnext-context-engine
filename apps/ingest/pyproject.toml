[project]
name = "harnext-ingest"
version = "0.1.0"
description = "Source registration API + connectors (GitHub, Slack, Discord, LiveAgent, YouTube, Sitemap) → CloudEvents → Kafka raw topic."
requires-python = ">=3.12"
dependencies = [
    "harnext-shared",
    "harnext-builder",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "aiokafka>=0.11",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "celery[redis]>=5.4",
    "yt-dlp>=2026.7.4,<2027",
]

[project.scripts]
harnext-ingest = "harnext_ingest.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harnext_ingest"]
