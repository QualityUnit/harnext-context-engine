[project]
name = "meaninggrid-classifier"
version = "0.1.0"
description = "Fast/batch lane router: rules floor + per-entity anomaly score + batch windowing."
requires-python = ">=3.12"
dependencies = [
    "meaninggrid-shared",
    "aiokafka>=0.11",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
]

[project.scripts]
meaninggrid-classifier = "meaninggrid_classifier.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meaninggrid_classifier"]
