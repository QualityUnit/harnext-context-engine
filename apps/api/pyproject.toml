[project]
name = "meaninggrid-api"
version = "0.0.1"
description = "Ingest API + read API."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aiokafka>=0.12",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "aioboto3>=13.0",
    "python-multipart>=0.0.12",
    "graphiti-core[falkordb]>=0.10",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "huggingface-hub>=0.26",
    "meaninggrid-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meaninggrid_api"]
