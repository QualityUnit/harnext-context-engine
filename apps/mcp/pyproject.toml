[project]
name = "meaninggrid-mcp"
version = "0.1.0"
description = "The only external surface: MCP context tools (research / get_urls / update) over an org's AgentFS."
requires-python = ">=3.12"
dependencies = [
    "meaninggrid-shared",
    "meaninggrid-builder",
    "fastmcp>=2.0",
    "claude-agent-sdk>=0.1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
]

[project.scripts]
meaninggrid-mcp = "meaninggrid_mcp.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meaninggrid_mcp"]
