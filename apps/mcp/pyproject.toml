[project]
name = "meaninggrid-mcp"
version = "0.0.1"
description = "MCP server exposing read-only Cypher over the tenant's FalkorDB graph."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "falkordb>=1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "meaninggrid-shared",
]

[project.scripts]
meaninggrid-mcp = "meaninggrid_mcp.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meaninggrid_mcp"]
