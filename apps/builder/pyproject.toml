[project]
name = "meaninggrid-builder"
version = "0.1.0"
description = "Stateless builder consumer: runs a coding harness over each org's AgentFS to incorporate events."
requires-python = ">=3.12"
dependencies = [
    "meaninggrid-shared",
    "aiokafka>=0.11",
    "claude-agent-sdk>=0.1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "harnext>=1.5.0",
]

[project.scripts]
meaninggrid-builder = "meaninggrid_builder.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meaninggrid_builder"]
