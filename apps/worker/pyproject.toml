[project]
name = "meaninggrid-worker"
version = "0.0.1"
description = "Async ingestion worker — consumes events.raw.v1, runs processors, writes to sinks (Graphiti)."
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "aioboto3>=13.0",
    "pypdf>=5.0",
    "graphiti-core[falkordb]>=0.10",
    "meaninggrid-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meaninggrid_worker"]
