[project]
name = "meaninggrid"
version = "0.1.0"
description = "Open-source streaming Context Engine for AI agents (AgentFS-backed CMS)."
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["apps/ingest", "apps/classifier", "apps/builder", "apps/mcp", "packages/shared"]

[tool.uv.sources]
meaninggrid-shared = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "ASYNC"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["apps", "packages"]
exclude = ["**/__pycache__", "**/.venv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/*/tests", "packages/*/tests"]
