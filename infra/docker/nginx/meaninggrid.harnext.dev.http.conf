# MeaningGrid — meaninggrid.harnext.dev  (HTTP bootstrap)
# Use this BEFORE a TLS cert exists: it serves the ACME challenge and proxies
# the site over plain HTTP. Once certbot issues the cert, replace this file with
# meaninggrid.harnext.dev.conf (HTTP->HTTPS redirect + HTTPS server) and reload.

server {
    listen 80;
    listen [::]:80;
    server_name meaninggrid.harnext.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://meaninggrid-ingest:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp {
        proxy_pass http://meaninggrid-mcp:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://meaninggrid-web:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
