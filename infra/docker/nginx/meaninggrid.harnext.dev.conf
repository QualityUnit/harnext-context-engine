# MeaningGrid — meaninggrid.harnext.dev
# Drop into the shared reverse proxy's nginx/conf.d/.
# Path-routed on one domain:  / -> web,  /api -> ingest,  /mcp -> mcp.
# Upstreams are reached by container name over the external `reverse-proxy` network.

# HTTP -> HTTPS (+ ACME challenge)
server {
    listen 80;
    listen [::]:80;
    server_name meaninggrid.harnext.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name meaninggrid.harnext.dev;

    ssl_certificate     /etc/letsencrypt/live/meaninggrid.harnext.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meaninggrid.harnext.dev/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/meaninggrid.harnext.dev/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self';" always;

    access_log /var/log/nginx/meaninggrid-access.log;
    error_log  /var/log/nginx/meaninggrid-error.log;

    client_max_body_size 25M;

    # --- Ingest API (strip the /api prefix) ---
    location /api/ {
        proxy_pass http://meaninggrid-ingest:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- MCP server (streamable HTTP; keep the /mcp path, no buffering) ---
    location /mcp {
        proxy_pass http://meaninggrid-mcp:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Web dashboard (default) ---
    location / {
        proxy_pass http://meaninggrid-web:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
