# Harnext — app.harnext.dev  (HTTP bootstrap)
# Use this BEFORE a TLS cert exists: it serves the ACME challenge and proxies
# the site over plain HTTP. Once certbot issues the cert, replace this file with
# app.harnext.dev.conf (HTTP->HTTPS redirect + HTTPS server) and reload.

server {
    listen 80;
    listen [::]:80;
    server_name app.harnext.dev;

    # Re-resolve upstreams via Docker's embedded DNS so a recreated container
    # (new IP) doesn't 502 until nginx is reloaded. Variable proxy_pass forces
    # per-request resolution.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 25M;

    location /api/ {
        set $up_ingest harnext-ingest;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$up_ingest:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp {
        set $up_mcp harnext-mcp;
        proxy_pass http://$up_mcp:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        set $up_web harnext-web;
        proxy_pass http://$up_web:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
