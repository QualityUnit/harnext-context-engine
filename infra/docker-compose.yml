# Local-dev infra for meaninggrid.
# Brings up: Redpanda (Kafka API), FalkorDB (Redis-based graph), MinIO (S3-compatible blobs).
#
#   docker compose -f infra/docker-compose.yml up -d
#
# See docs/architecture/ingestion-pipeline.md §3 for what each one is for.

services:
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: meaninggrid-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
    ports:
      - "9092:9092"   # Kafka API
      - "8082:8082"   # HTTP proxy (handy for curl-based debugging)
      - "9644:9644"   # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  falkordb:
    image: falkordb/falkordb:latest
    container_name: meaninggrid-falkordb
    ports:
      - "6380:6379"   # Redis / FalkorDB protocol (host 6380 to avoid local Redis on 6379)
      - "3001:3000"   # FalkorDB Browser
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: meaninggrid-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: meaninggrid
      MINIO_ROOT_PASSWORD: meaninggrid_dev
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redpanda_data:
  falkordb_data:
  minio_data:
