# Local-dev infra for the CMS.
# Brings up: Redpanda (Kafka API) + the Redpanda Console (topic inspection).
# The per-org context lives in AgentFS on disk, so no graph/blob store is needed.
#
#   docker compose -f infra/docker-compose.yml up -d
#
services:
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: meaninggrid-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
    ports:
      - "9092:9092"   # Kafka API
      - "8082:8082"   # HTTP proxy (handy for curl-based debugging)
      - "9644:9644"   # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  redpanda_data:
