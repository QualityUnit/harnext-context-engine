[project]
name = "meaninggrid-shared"
version = "0.0.1"
description = "Shared types: CloudEvents envelope, pipeline protocols, DB models, Kafka topic names."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meaninggrid_shared"]
